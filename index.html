<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>AIESEC 101</title>
    <meta
      name="description"
      content="Todo lo que necesitas para entender AIESEC: qué es, cómo se organiza, su cultura y cómo crecer como líder."
    />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="assets/img/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
    />
    <link rel="stylesheet" href="assets/css/tokens.css" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/layout.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
    <link rel="stylesheet" href="assets/css/inicio.css" />
  </head>
  <body data-page="inicio">
    <a class="skip" href="#contenido">Saltar al contenido</a>
    <div data-site-header></div>

    <main id="contenido">
      <section class="course-hero">
        <div class="wrap course-hero__in">
          <div class="course-hero__txt">
            <p class="kicker">AIESEC en ESEN · Curso</p>
            <h1>AIESEC <span>101</span></h1>
            <p class="course-hero__frase" id="frase"></p>
            <p class="course-hero__intro" id="intro"></p>
            <div class="course-hero__cta">
              <a class="btn btn--big" id="ctaMain" href="aprende.html"
                >Empezar</a
              >
              <span class="course-hero__meta" id="meta"></span>
            </div>
          </div>
          <div class="ring" id="ring" aria-live="polite"></div>
        </div>
      </section>

      <section class="section section--white" id="modulos">
        <div class="wrap">
          <header class="section__head">
            <h2>Módulos</h2>
            <p>
              Te recomendamos seguir el orden, pero puedes entrar a cualquiera.
            </p>
          </header>
          <ol class="mods" id="mods"></ol>
          <button class="reset" type="button" id="reset">
            Reiniciar mi progreso
          </button>
        </div>
      </section>

      <section class="section section--dark" id="hacia-donde-vamos">
        <div class="wrap">
          <header class="section__head">
            <h2>Hacia dónde vamos</h2>
          </header>
          <div class="grid" id="metas-grid"></div>
        </div>
      </section>
    </main>

    <div data-site-footer></div>

    <script src="data/site.js"></script>
    <script src="assets/js/site.js"></script>
    <script src="assets/js/modal.js"></script>
    <script src="assets/js/inicio.js"></script>
  </body>
</html>
