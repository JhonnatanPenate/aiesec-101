<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Diccionario · AIESEC 101</title>
    <meta
      name="description"
      content="Siglas y conceptos de AIESEC. Toca una card para ver qué significa."
    />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="assets/img/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
    />
    <link rel="stylesheet" href="assets/css/tokens.css" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/layout.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
    <link rel="stylesheet" href="assets/css/diccionario.css" />
  </head>
  <body data-page="diccionario">
    <a class="skip" href="#contenido">Saltar al contenido</a>
    <div data-site-header></div>

    <main id="contenido">
      <section class="page-head">
        <div class="wrap">
          <p class="kicker">AIESEC en ESEN</p>
          <h1>Diccionario</h1>
          <p>
            Siglas y conceptos de AIESEC. Toca una card para ver qué significa.
          </p>
        </div>
      </section>

      <section class="section section--sand" id="siglas">
        <div class="wrap">
          <header class="section__head">
            <h2>Siglas</h2>
            <p>
              Toca una card para voltearla y ver su nombre en inglés y qué
              significa.
            </p>
          </header>
          <div class="dict-tools">
            <label for="q" class="sr">Buscar</label>
            <input
              id="q"
              type="search"
              placeholder="Busca una sigla o palabra. Ej: LCVP, EXPA, Approved"
              autocomplete="off"
            />
            <button
              class="btn btn--dark"
              type="button"
              id="flipAll"
              aria-pressed="false"
            >
              Voltear todas
            </button>
          </div>
          <div
            class="chips"
            id="cats"
            role="group"
            aria-label="Categorías"
          ></div>
          <p class="dict-count" id="count" aria-live="polite"></p>
          <div class="dict" id="dict"></div>
        </div>
      </section>
      <section class="section section--dark" id="quiz">
        <div class="wrap">
          <header class="section__head">
            <h2>Ponte a prueba</h2>
            <p>10 preguntas al azar. Elige qué significa cada sigla.</p>
          </header>
          <div class="quiz" id="quizBox">
            <div class="quiz__top">
              <p class="kicker" id="qStep"></p>
              <div class="quiz__bar" aria-hidden="true">
                <span id="qBar"></span>
              </div>
            </div>
            <div id="qStage"></div>
          </div>
        </div>
      </section>
    </main>

    <div data-site-footer></div>

    <script src="data/site.js"></script>
    <script src="assets/js/site.js"></script>
    <script src="assets/js/modal.js"></script>
    <script src="data/diccionario.js"></script>
    <script src="assets/js/diccionario.js"></script>
  </body>
</html>
